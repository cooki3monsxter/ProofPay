openapi: 3.0.3
info:
  title: ProofPay API
  version: 1.2.0
  description: |
    ProofPay is pay-on-proof escrow built on PayPal. Clients fund milestones with a PayPal
    authorization hold; freelancers submit proof (a merged GitHub PR, a live URL, or a document);
    ProofPay verifies it with deterministic checks plus AI review, scores release risk with an ML
    model, and either captures and pays out automatically or holds the money for a human.

    **Authentication.** Creating an escrow returns one secret key per party (client, freelancer).
    Send it as `Authorization: Bearer <key>`. A key works only for its own escrow and role. People can
    mint extra *agent* keys for their AI agents; the server knows from the key that the caller is an
    agent. Reviewers use the platform admin key.

    **Money movement rules (enforced server-side):**
    - Funding always needs a person to approve the PayPal hold (`approvalUrl`).
    - Automatic release only when every criterion passes, verifier confidence ≥ 0.7 and risk < 0.35.
    - Agent keys can never override a policy hold, refund, retry payouts or resolve disputes (`HUMAN_APPROVAL_REQUIRED`).
    - Once work is submitted the client can't cancel; they request changes or dispute (`FREELANCER_PROTECTED`).
    - PayPal holds last 29 days; milestones due later must be funded closer to the start (`FUND_LATER`).
    - If the buyer later disputes a captured payment with PayPal, ProofPay answers with the verification record.
    - Payout timing is risk-priced: low risk is paid instantly, higher risk waits (48 h / 7 days by default), and an
      open PayPal dispute pauses it.

    **Portable proof of delivery.** Every released milestone gets an Ed25519-signed attestation (compact JWS, alg
    EdDSA). The public key is at `/.well-known/jwks.json`, so anyone can verify attestations without trusting
    ProofPay. Freelancers export all of theirs as a track record they own.
  contact:
    name: ProofPay
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
security:
- escrowKey: []
servers:
- url: http://localhost:8080
  description: Local
- url: https://proofpay.onrender.com
  description: Hosted demo (replace with your Render URL)
tags:
- name: Plans
  description: AI drafting of milestones from a scope of work
- name: Escrows
  description: Create and read escrows and their audit ledger
- name: Milestones
  description: Fund, prove, verify, release, refund, dispute
- name: Risk
  description: ML release-risk model
- name: Proof
  description: Signed, independently verifiable proof of delivery
- name: System
  description: Health and configuration
paths:
  /api/health:
    get:
      tags:
      - System
      operationId: getHealth
      security: []
      summary: Service status and active integrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Service status and active integrations.
  /api/plans/draft:
    post:
      tags:
      - Plans
      operationId: draftPlan
      security: []
      summary: Draft milestones and acceptance criteria from a scope of work
      description: Uses Claude (structured output) or a deterministic parser when no AI key is configured. Creates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPlanRequest'
            example:
              scopeText: 'Milestone 1: Landing page - $300, due in 7 days. Live at a public URL.'
              currency: USD
      responses:
        '200':
          description: Draft plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/escrows:
    get:
      tags:
      - Escrows
      operationId: listEscrows
      summary: List all escrows (reviewer / admin key only)
      responses:
        '200':
          description: Escrow summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscrowSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: List all escrows (reviewer / admin key only).
    post:
      tags:
      - Escrows
      operationId: createEscrow
      security: []
      summary: Create an escrow from a reviewed plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEscrowRequest'
      responses:
        '201':
          description: Created. The access keys are returned only here — store them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedEscrow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Create an escrow from a reviewed plan.
  /api/escrows/from-scope:
    post:
      tags:
      - Escrows
      operationId: createEscrowFromScope
      security: []
      summary: Draft a plan with AI and create the escrow in one call (agent-friendly)
      description: 'With header `x-created-by: agent`, the response contains an agent key instead of the client key; the person
        receives their client key when they approve the first PayPal hold.'
      parameters:
      - name: x-created-by
        in: header
        required: false
        schema:
          type: string
          enum:
          - agent
        description: Set to `agent` when an AI agent creates the escrow.
        example: agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFromScopeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CreatedEscrow'
                - type: object
                  required:
                  - plan
                  properties:
                    plan:
                      $ref: '#/components/schemas/DraftPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/escrows/{escrowId}/agent-keys:
    post:
      tags:
      - Escrows
      operationId: createAgentKey
      summary: Create a key for your AI agent (acts as your role, with agent restrictions)
      parameters:
      - $ref: '#/components/parameters/EscrowId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 80
                  description: Short label.
                  example: PR merged
      responses:
        '201':
          description: Agent key (shown once)
          content:
            application/json:
              schema:
                type: object
                required:
                - agentKey
                - role
                properties:
                  agentKey:
                    type: string
                    description: 'Secret key for the AI agent. Shown once; send it as `Authorization: Bearer <key>`.'
                    example: ppca_3f9c1e7a2b4d4e0f9a1b2c3d4e5f6a7b
                  role:
                    type: string
                    enum:
                    - client
                    - freelancer
                    description: Role of the key holder.
                    example: client
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Create a key for your AI agent (acts as your role, with agent restrictions).
  /api/escrows/{escrowId}:
    get:
      tags:
      - Escrows
      operationId: getEscrow
      summary: Get an escrow with milestones, evidence, verdicts and risk (any party's key)
      parameters:
      - $ref: '#/components/parameters/EscrowId'
      responses:
        '200':
          description: Escrow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Get an escrow with milestones, evidence, verdicts and risk (any party's key).
  /api/events:
    get:
      tags:
      - Escrows
      operationId: listEvents
      summary: Audit ledger of every money movement and decision
      description: With `escrowId`, any key for that escrow works. Without it, the admin key is required.
      parameters:
      - name: escrowId
        in: query
        required: false
        description: Only return events for this escrow. Reviewers can omit it to list events across all escrows.
        schema:
          type: string
        example: esc_1a2b3c4d5e6f7a8b
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/milestones/{milestoneId}/fund:
    post:
      tags:
      - Milestones
      operationId: fundMilestone
      summary: Create a PayPal order (intent AUTHORIZE) and return the approval URL
      description: The client must open `approvalUrl` and approve. On return (or the CHECKOUT.ORDER.APPROVED webhook) ProofPay
        places the authorization hold.
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                required:
                - milestone
                - approvalUrl
                properties:
                  milestone:
                    $ref: '#/components/schemas/Milestone'
                  approvalUrl:
                    type: string
                    format: uri
                    description: PayPal URL where a person approves the authorization hold. Agents must hand this to a human.
                    example: https://www.sandbox.paypal.com/checkoutnow?token=5O190127TN364715T
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/PayPalError'
  /api/milestones/{milestoneId}/evidence:
    post:
      tags:
      - Milestones
      operationId: submitEvidence
      summary: Submit proof of work; verification and the release decision run immediately
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitEvidenceRequest'
            example:
              items:
              - kind: github_pr
                value: https://github.com/acme/shop/pull/42
              - kind: url
                value: https://shop.example.com/checkout
      responses:
        '200':
          description: Escrow after verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Submit proof of work; verification and the release decision run immediately.
  /api/milestones/{milestoneId}/verify:
    post:
      tags:
      - Milestones
      operationId: verifyMilestone
      summary: Re-run verification on submitted evidence
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Escrow after verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Re-run verification on submitted evidence.
  /api/milestones/{milestoneId}/release:
    post:
      tags:
      - Milestones
      operationId: releaseMilestone
      summary: Capture the hold and pay out the freelancer (human approval for policy holds)
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/PayPalError'
      description: Capture the hold and pay out the freelancer (human approval for policy holds).
  /api/milestones/{milestoneId}/request-changes:
    post:
      tags:
      - Milestones
      operationId: requestChanges
      summary: Send work back to the freelancer; money stays held
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Send work back to the freelancer; money stays held.
  /api/milestones/{milestoneId}/refund:
    post:
      tags:
      - Milestones
      operationId: refundMilestone
      summary: Void the PayPal hold (client is never charged) or cancel an unfunded milestone
      description: |
        Escrow protects both sides. The client can cancel before funding, or after the deadline passes
        with no delivery. Once work is submitted the client must request changes or dispute
        (`403 FREELANCER_PROTECTED`). The freelancer can return the money at any time before release.
        Reviewers refund disputed milestones. Agents can never refund.
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/milestones/{milestoneId}/retry-payout:
    post:
      tags:
      - Milestones
      operationId: retryPayout
      summary: Send the freelancer's payout now (a scheduled, failed or dispute-paused payout)
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Payout sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Send the freelancer's payout now (a scheduled, failed or dispute-paused payout).
  /api/milestones/{milestoneId}/dispute:
    post:
      tags:
      - Milestones
      operationId: openDispute
      summary: Freeze the milestone and generate a neutral AI brief for a reviewer
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        $ref: '#/components/requestBodies/Reason'
      responses:
        '200':
          description: Disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Freeze the milestone and generate a neutral AI brief for a reviewer.
  /api/milestones/{milestoneId}/resolve:
    post:
      tags:
      - Milestones
      operationId: resolveDispute
      summary: Reviewer resolves a dispute by releasing or refunding
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outcome
              properties:
                outcome:
                  type: string
                  enum:
                  - release
                  - refund
                  description: How the dispute was resolved.
                  example: release
                note:
                  type: string
                  description: Free-text note.
                  example: Please add a section on backups
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escrow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Reviewer resolves a dispute by releasing or refunding.
  /api/milestones/{milestoneId}/risk:
    get:
      tags:
      - Risk
      operationId: getMilestoneRisk
      summary: Current ML release-risk score with the top contributing factors
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Risk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Current ML release-risk score with the top contributing factors.
  /.well-known/jwks.json:
    get:
      tags:
      - Proof
      operationId: getAttestationKeys
      summary: Public keys for verifying delivery attestations (JWKS)
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          example: OKP
                          description: JWK key type. Always `OKP`.
                        crv:
                          type: string
                          example: Ed25519
                          description: JWK curve. Always `Ed25519`.
                        x:
                          type: string
                          description: Ed25519 public key, base64url.
                          example: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                        kid:
                          type: string
                          description: Key ID of the signing key.
                          example: pp-ed25519-2026-11
                        alg:
                          type: string
                          example: EdDSA
                          description: JWS signing algorithm. Always `EdDSA` (Ed25519).
                        use:
                          type: string
                          example: sig
                          description: JWK public key use. Always `sig`.
                    description: Public signing keys (JWK).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Public keys for verifying delivery attestations (JWKS).
  /api/attestations/verify:
    post:
      tags:
      - Proof
      operationId: verifyAttestation
      summary: Verify one attestation and get its live status
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: Compact JWS attestation token.
                  example: eyJhbGciOiJFZERTQSIsImtpZCI6InBwLWVkMjU1MTktMjAyNi0xMSJ9.eyJzdWIiOiJtc19hNDIifQ.c2lnbmF0dXJl
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestationVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Verify one attestation and get its live status.
  /api/attestations/verify-bundle:
    post:
      tags:
      - Proof
      operationId: verifyAttestationBundle
      summary: Verify a freelancer's whole track record
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tokens
              properties:
                tokens:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                  description: List of compact JWS attestation tokens.
      responses:
        '200':
          description: One result per token
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttestationVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Verify a freelancer's whole track record.
  /api/attestations/{milestoneId}/status:
    get:
      tags:
      - Proof
      operationId: getAttestationStatus
      summary: Live status of an attestation (a PayPal dispute or refund after release)
      security: []
      parameters:
      - $ref: '#/components/parameters/MilestoneId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Numeric ID.
                  status:
                    type: string
                    enum:
                    - valid
                    - disputed
                    - revoked
                    - unknown
                    description: Current status.
                    example: valid
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Live status of an attestation (a PayPal dispute or refund after release).
  /api/escrows/{escrowId}/track-record:
    get:
      tags:
      - Proof
      operationId: getTrackRecord
      summary: Every attestation issued to this escrow's freelancer, as one bundle (freelancer key)
      parameters:
      - $ref: '#/components/parameters/EscrowId'
      responses:
        '200':
          description: Bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: string
                    description: sha256 of the salted email
                  issuer:
                    type: string
                    description: Issuer of the attestation (the ProofPay base URL).
                    example: https://proofpay.onrender.com
                  count:
                    type: integer
                    description: Number of items.
                    example: 3
                  tokens:
                    type: array
                    items:
                      type: string
                    description: List of compact JWS attestation tokens.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Every attestation issued to this escrow's freelancer, as one bundle (freelancer key).
  /api/desk:
    get:
      tags:
      - Risk
      operationId: getRiskDesk
      summary: One row per milestone across all escrows, for reviewers (admin key)
      responses:
        '200':
          description: Desk rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: One row per milestone across all escrows, for reviewers (admin key).
  /api/admin/sweep:
    post:
      tags:
      - System
      operationId: sweepHolds
      summary: Warn before PayPal holds expire and un-fund lapsed ones (admin key; used by the Render cron job)
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiring:
                    type: integer
                    description: Number of PayPal holds expiring within 3 days.
                    example: 1
                  expired:
                    type: integer
                    description: Number of PayPal holds that expired in this sweep.
                    example: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Warn before PayPal holds expire and un-fund lapsed ones (admin key; used by the Render cron job).
  /api/ml/export:
    get:
      tags:
      - Risk
      operationId: exportOutcomes
      summary: Labelled real outcomes with the features logged at decision time (admin key)
      responses:
        '200':
          description: CSV for ml/train.py --real
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Labelled real outcomes with the features logged at decision time (admin key).
  /api/ml/calibration:
    get:
      tags:
      - Risk
      operationId: getCalibration
      summary: Predicted risk vs actual outcomes so far (admin key)
      responses:
        '200':
          description: Calibration by risk band
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes:
                    type: integer
                    description: Number of recorded real outcomes.
                    example: 12
                  brierScore:
                    type: number
                    nullable: true
                    description: Brier score of the model on recorded outcomes (lower is better).
                    example: 0.18
                  note:
                    type: string
                    description: Free-text note.
                    example: Please add a section on backups
                  bands:
                    type: array
                    items:
                      type: object
                      properties:
                        band:
                          type: string
                          description: 'Risk band derived from the score: low, medium or high.'
                          example: low
                        count:
                          type: integer
                          description: Number of items.
                          example: 3
                        predictedAvg:
                          type: number
                          nullable: true
                          description: Average predicted risk in this band.
                          example: 0.1
                        actualRate:
                          type: number
                          nullable: true
                          description: Share of milestones in this band that actually ended in a dispute or refund.
                          example: 0.12
                    description: Calibration results grouped by risk band.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Predicted risk vs actual outcomes so far (admin key).
  /api/ml/model:
    get:
      tags:
      - Risk
      operationId: getRiskModel
      security: []
      summary: Risk model version, features and evaluation metrics
      responses:
        '200':
          description: Model info
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    description: Version string.
                    example: 1.2.0
                  features:
                    type: object
                    additionalProperties:
                      type: string
                    description: Feature values used by the risk model.
                  metrics:
                    type: object
                    additionalProperties:
                      type: number
                    description: Model evaluation metrics.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      description: Risk model version, features and evaluation metrics.
components:
  parameters:
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: string
      example: ms_a42ffc3d34414c75
      description: Milestone ID, as returned when the escrow is created.
    EscrowId:
      name: escrowId
      in: path
      required: true
      description: Escrow ID, as returned when the escrow is created.
      schema:
        type: string
      example: esc_1a2b3c4d5e6f7a8b
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - reason
            properties:
              reason:
                type: string
                minLength: 3
                description: Reason given by the person taking the action.
                example: No delivery after the deadline
      description: Why the person is taking this action. Stored in the audit ledger.
  securitySchemes:
    escrowKey:
      type: http
      scheme: bearer
      description: An escrow access key (client, freelancer or agent) or the reviewer admin key.
      bearerFormat: opaque key (ppc_, ppf_, ppca_, ppfa_ or admin)
  responses:
    Unauthorized:
      description: No access key sent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHORIZED
            message: No access key sent
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: VALIDATION_ERROR
            message: Validation error
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NOT_FOUND
            message: Not found
    Conflict:
      description: Action not allowed in the milestone's current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_STATE
            message: Action not allowed in the milestone's current state
    Forbidden:
      description: FORBIDDEN (wrong key or role), HUMAN_APPROVAL_REQUIRED or FREELANCER_PROTECTED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: FORBIDDEN
            message: FORBIDDEN (wrong key or role), HUMAN_APPROVAL_REQUIRED or FREELANCER_PROTECTED
    PayPalError:
      description: PayPal returned an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: PAYPAL_ERROR
            message: PayPal returned an error
    TooManyRequests:
      description: Rate limit reached (for example GitHub's API limit during verification). Try again later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: RATE_LIMITED
            message: Rate limit reached (for example GitHub's API limit during verification). Try again later.
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INTERNAL
            message: Unexpected server error.
  schemas:
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          example: HUMAN_APPROVAL_REQUIRED
          description: Machine-readable error code, e.g. `FORBIDDEN`, `FUND_LATER`, `HUMAN_APPROVAL_REQUIRED`.
        message:
          type: string
          description: Human-readable message.
          example: Milestone is due after the 29-day PayPal hold limit. Fund it closer to the start date.
        debugId:
          type: string
          nullable: true
          description: PayPal debug id when relevant
    Health:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the request succeeded.
          example: true
        paypal:
          type: string
          enum:
          - sandbox
          - demo
          description: 'PayPal mode: `sandbox` with real API keys, or `demo` (built-in simulator).'
          example: sandbox
        ai:
          type: string
          enum:
          - claude
          - heuristic
          description: 'Which AI engine is active: `claude` when an Anthropic key is set, otherwise the `heuristic` fallback.'
          example: claude
        model:
          type: string
          description: Model identifier.
          example: logreg-v1
        platformFeePct:
          type: number
          description: ProofPay platform fee as a percentage.
          example: 2
        policy:
          type: object
          properties:
            autoReleaseMaxRisk:
              type: number
              description: Highest ML risk score at which money may be released automatically.
              example: 0.35
            minVerifierConfidence:
              type: number
              description: Minimum verifier confidence needed for automatic release.
              example: 0.7
          description: Release policy thresholds in force.
    Party:
      type: object
      required:
      - name
      - email
      properties:
        name:
          type: string
          description: Name.
          example: Online ordering page
        email:
          type: string
          format: email
          description: Email address.
          example: riya@freelancer.example
    CriterionType:
      type: string
      enum:
      - github_pr_merged
      - github_checks_passed
      - url_live
      - url_contains
      - ai_judgment
    DraftCriterion:
      type: object
      required:
      - type
      - description
      properties:
        type:
          $ref: '#/components/schemas/CriterionType'
        description:
          type: string
          description: Free-text description.
          example: Online ordering page with menu and checkout
        params:
          type: object
          additionalProperties:
            type: string
          description: '`text` for url_contains, optional `pathPrefix` for github_pr_merged'
    Criterion:
      allOf:
      - $ref: '#/components/schemas/DraftCriterion'
      - type: object
        required:
        - id
        properties:
          id:
            type: string
            description: Numeric ID.
    DraftMilestone:
      type: object
      required:
      - title
      - amount
      - criteria
      properties:
        title:
          type: string
          description: Title.
          example: Menu page
        description:
          type: string
          description: Free-text description.
          example: Online ordering page with menu and checkout
        amount:
          type: number
          minimum: 0.01
          description: Amount in the escrow currency, as a decimal number.
          example: 400
        dueInDays:
          type: integer
          nullable: true
          description: Days from now until the milestone is due.
          example: 5
        criteria:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DraftCriterion'
          description: Acceptance criteria that must all pass before release.
    DraftPlanRequest:
      type: object
      required:
      - scopeText
      properties:
        scopeText:
          type: string
          minLength: 20
          description: Plain-English scope of work.
          example: 'Build an online ordering page for a bakery. Milestone 1: menu page - $400, due in 5 days.'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
          description: ISO 4217 currency code.
          example: USD
    DraftPlan:
      type: object
      required:
      - title
      - currency
      - milestones
      - warnings
      - engine
      properties:
        title:
          type: string
          description: Title.
          example: Menu page
        currency:
          type: string
          description: ISO 4217 currency code.
          example: USD
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/DraftMilestone'
          description: Milestones in this escrow.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal warnings.
        engine:
          type: string
          enum:
          - claude
          - heuristic
          description: 'Engine that produced the result: `claude` or the `heuristic` fallback.'
          example: claude
    CreateEscrowRequest:
      type: object
      required:
      - title
      - client
      - freelancer
      - milestones
      properties:
        title:
          type: string
          description: Title.
          example: Menu page
        currency:
          type: string
          default: USD
          description: ISO 4217 currency code.
          example: USD
        scopeText:
          type: string
          description: Plain-English scope of work.
          example: 'Build an online ordering page for a bakery. Milestone 1: menu page - $400, due in 5 days.'
        client:
          $ref: '#/components/schemas/Party'
        freelancer:
          $ref: '#/components/schemas/Party'
        milestones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DraftMilestone'
          description: Milestones in this escrow.
    CreateFromScopeRequest:
      type: object
      required:
      - scopeText
      - client
      - freelancer
      properties:
        scopeText:
          type: string
          minLength: 20
          description: Plain-English scope of work.
          example: 'Build an online ordering page for a bakery. Milestone 1: menu page - $400, due in 5 days.'
        currency:
          type: string
          default: USD
          description: ISO 4217 currency code.
          example: USD
        client:
          $ref: '#/components/schemas/Party'
        freelancer:
          $ref: '#/components/schemas/Party'
    EvidenceItem:
      type: object
      required:
      - kind
      - value
      properties:
        kind:
          type: string
          enum:
          - github_pr
          - url
          - text
          description: 'Type of proof: a GitHub pull request, a live URL, or text.'
          example: github_pr
        value:
          type: string
          maxLength: 50000
          description: An http(s) URL for github_pr and url; free text for text
        note:
          type: string
          maxLength: 2000
          description: Free-text note.
          example: Please add a section on backups
    SubmitEvidenceRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/EvidenceItem'
          description: List of results.
    Evidence:
      allOf:
      - $ref: '#/components/schemas/EvidenceItem'
      - type: object
        properties:
          id:
            type: string
            description: Numeric ID.
          milestoneId:
            type: string
            description: Milestone ID.
            example: ms_a42ffc3d34414c75
          submittedAt:
            type: string
            format: date-time
            description: When proof was submitted, ISO 8601.
            example: '2026-11-13T12:00:00.000Z'
    CriterionResult:
      type: object
      properties:
        criterionId:
          type: string
          description: ID of the acceptance criterion this result belongs to.
          example: cr_1
        passed:
          type: boolean
          description: Whether this check passed.
          example: true
        pending:
          type: boolean
          description: Not finished yet (PR open, CI running); re-checked by the GitHub webhook
        confidence:
          type: number
          description: Verifier confidence from 0 to 1.
          example: 0.86
        detail:
          type: string
          description: Human-readable explanation.
          example: 'PR #42 is merged and all checks passed'
    Verdict:
      type: object
      properties:
        passed:
          type: boolean
          description: Whether this check passed.
          example: true
        confidence:
          type: number
          description: Verifier confidence from 0 to 1.
          example: 0.86
        results:
          type: array
          items:
            $ref: '#/components/schemas/CriterionResult'
          description: Per-criterion verification results.
        summary:
          type: string
          description: Short summary.
          example: Two of three milestones are verified and paid.
        verifiedAt:
          type: string
          format: date-time
          description: When the work was verified, ISO 8601.
          example: '2026-11-13T12:01:00.000Z'
        engine:
          type: string
          enum:
          - claude
          - heuristic
          description: 'Engine that produced the result: `claude` or the `heuristic` fallback.'
          example: claude
    RiskAssessment:
      type: object
      properties:
        score:
          type: number
          description: Probability of dispute or non-delivery
          example: 0.12
        band:
          type: string
          enum:
          - low
          - medium
          - high
          description: 'Risk band derived from the score: low, medium or high.'
          example: low
        modelVersion:
          type: string
          description: Version of the risk model.
          example: 1.0.0
        reasons:
          type: array
          items:
            type: object
            properties:
              feature:
                type: string
                description: Model feature name.
                example: deadline_slack_days
              label:
                type: string
                description: Short label.
                example: PR merged
              impact:
                type: number
                description: Contribution to the log-odds; positive raises risk
          description: Top factors behind the risk score.
    MilestoneStatus:
      type: string
      enum:
      - DRAFT
      - AWAITING_APPROVAL
      - FUNDED
      - SUBMITTED
      - NEEDS_REVIEW
      - CHANGES_REQUESTED
      - RELEASED
      - DISPUTED
      - REFUNDED
    Milestone:
      type: object
      properties:
        id:
          type: string
          description: Numeric ID.
        escrowId:
          type: string
          description: Escrow ID.
          example: esc_1a2b3c4d5e6f7a8b
        seq:
          type: integer
          description: Sequence number of the event in the ledger.
          example: 7
        title:
          type: string
          description: Title.
          example: Menu page
        description:
          type: string
          description: Free-text description.
          example: Online ordering page with menu and checkout
        amount:
          type: number
          description: Amount in the escrow currency, as a decimal number.
          example: 400
        dueDate:
          type: string
          format: date-time
          nullable: true
          description: Milestone deadline, ISO 8601.
          example: '2026-11-20T00:00:00.000Z'
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
          description: Acceptance criteria that must all pass before release.
        status:
          $ref: '#/components/schemas/MilestoneStatus'
        paypalOrderId:
          type: string
          nullable: true
          description: PayPal order ID created for funding.
          example: 5O190127TN364715T
        approvalUrl:
          type: string
          nullable: true
          description: PayPal URL where a person approves the authorization hold. Agents must hand this to a human.
          example: https://www.sandbox.paypal.com/checkoutnow?token=5O190127TN364715T
        authorizationId:
          type: string
          nullable: true
          description: PayPal authorization ID for the held funds.
          example: 0VF52814937998046
        authorizationExpiresAt:
          type: string
          nullable: true
          description: When the PayPal authorization hold expires (29 days after approval), ISO 8601.
          example: '2026-12-10T09:30:00.000Z'
        captureId:
          type: string
          nullable: true
          description: PayPal capture ID once the held funds are captured.
          example: 3C679366HH908993F
        payoutBatchId:
          type: string
          nullable: true
          description: PayPal Payouts batch ID.
          example: 5UXD2E8A7EBQJ
        resubmissions:
          type: integer
          description: How many times proof was resubmitted.
          example: 1
        fundedAt:
          type: string
          nullable: true
          description: When the PayPal hold was approved, ISO 8601.
          example: '2026-11-12T10:20:00.000Z'
        submittedAt:
          type: string
          nullable: true
          description: When proof was submitted, ISO 8601.
          example: '2026-11-13T12:00:00.000Z'
        releasedAt:
          type: string
          nullable: true
          description: When the money was released, ISO 8601.
          example: '2026-11-14T08:00:00.000Z'
        lastVerdict:
          type: object
          allOf:
          - $ref: '#/components/schemas/Verdict'
          nullable: true
          description: Most recent verification result.
        risk:
          type: object
          allOf:
          - $ref: '#/components/schemas/RiskAssessment'
          nullable: true
          description: ML release-risk assessment.
        decision:
          type: string
          nullable: true
          description: What ProofPay decided after verification, e.g. `auto_release`, `hold_for_client`, `changes_requested`.
          example: auto_release
        payoutDueAt:
          type: string
          nullable: true
          description: When the risk-priced payout goes out
        payoutPaused:
          type: boolean
          description: A PayPal dispute opened before the payout went out
        attestation:
          type: string
          nullable: true
          description: Ed25519-signed proof of delivery (compact JWS)
        attestationStatus:
          type: string
          nullable: true
          enum:
          - valid
          - disputed
          - revoked
          - unknown
          description: Current status of the signed proof of delivery.
          example: valid
        paypalDisputeId:
          type: string
          nullable: true
          description: A buyer dispute opened with PayPal after release
        paypalDisputeStatus:
          type: string
          nullable: true
          description: Status of a PayPal dispute on this payment, if any.
          example: WAITING_FOR_SELLER_RESPONSE
        receiptUrl:
          type: string
          nullable: true
          description: Signed public proof-of-delivery page (released milestones)
        holdExpiresSoon:
          type: boolean
          description: The PayPal hold expires within 3 days
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
          description: Proof submitted by the freelancer for this milestone.
    AttestationVerification:
      type: object
      properties:
        valid:
          type: boolean
          description: Whether the signature is valid.
          example: true
        reason:
          type: string
          description: Why verification failed
          example: No delivery after the deadline
        kid:
          type: string
          description: Key ID of the signing key.
          example: pp-ed25519-2026-11
        status:
          type: string
          enum:
          - valid
          - disputed
          - revoked
          - unknown
          description: Current status.
          example: valid
        payload:
          type: object
          additionalProperties: true
          description: Decoded attestation claims.
    Totals:
      type: object
      properties:
        total:
          type: number
          description: Total amount.
          example: 1200
        held:
          type: number
          description: Total amount currently held at PayPal.
          example: 800
        released:
          type: number
          description: Total amount released to the freelancer.
          example: 400
        refunded:
          type: number
          description: Total amount returned to the client.
          example: 0
    Escrow:
      type: object
      properties:
        id:
          type: string
          description: Numeric ID.
        title:
          type: string
          description: Title.
          example: Menu page
        clientName:
          type: string
          description: Client's display name.
          example: Asha Bakery
        clientEmail:
          type: string
          description: Client's email address (PayPal payer).
          example: asha@client.example
        freelancerName:
          type: string
          description: Freelancer's display name.
          example: Riya
        freelancerEmail:
          type: string
          description: Freelancer's PayPal email, used for the payout.
          example: riya@freelancer.example
        currency:
          type: string
          description: ISO 4217 currency code.
          example: USD
        scopeText:
          type: string
          description: Plain-English scope of work.
          example: 'Build an online ordering page for a bakery. Milestone 1: menu page - $400, due in 5 days.'
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CANCELLED
          description: Current status.
          example: ACTIVE
        createdBy:
          type: string
          enum:
          - web
          - agent
          - api
          description: 'Who created the escrow: `person` or `agent`.'
          example: web
        createdAt:
          type: string
          format: date-time
          description: Creation time, ISO 8601.
          example: '2026-11-12T10:15:00.000Z'
        totals:
          $ref: '#/components/schemas/Totals'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
          description: Milestones in this escrow.
        you:
          type: object
          description: The caller, as resolved from the key
          properties:
            role:
              type: string
              enum:
              - client
              - freelancer
              - reviewer
              description: Role of the key holder.
              example: client
            viaAgent:
              type: boolean
              description: Whether an AI agent key made the call.
              example: false
    CreatedEscrow:
      type: object
      required:
      - escrow
      - access
      properties:
        escrow:
          $ref: '#/components/schemas/Escrow'
        access:
          type: object
          description: Secret keys and share links. Returned once; only hashes are stored.
          properties:
            clientKey:
              type: string
              description: Secret client key for this escrow. Shown once.
              example: ppc_8d2f4a6b1c3e5f7a9b0c2d4e6f8a1b3c
            clientLink:
              type: string
              description: Dashboard link for the client, with the key in the URL fragment.
              example: http://localhost:8080/#/escrow/esc_1a2b3c4d5e6f7a8b?k=ppc_8d2f4a6b
            freelancerKey:
              type: string
              description: Secret freelancer key for this escrow. Shown once.
              example: ppf_2b4d6f8a0c1e3a5b7d9f1b3d5f7a9c0e
            freelancerLink:
              type: string
              description: Dashboard link for the freelancer, with the key in the URL fragment.
              example: http://localhost:8080/#/escrow/esc_1a2b3c4d5e6f7a8b?k=ppf_2b4d6f8a
            agentKey:
              type: string
              description: Present when created by an agent
              example: ppca_3f9c1e7a2b4d4e0f9a1b2c3d4e5f6a7b
            clientAccess:
              type: string
              description: 'How the client receives their key: `direct` (returned here) or `on_approval` (after approving
                the PayPal hold).'
              example: on_approval
    EscrowSummary:
      type: object
      properties:
        id:
          type: string
          description: Numeric ID.
        title:
          type: string
          description: Title.
          example: Menu page
        clientName:
          type: string
          description: Client's display name.
          example: Asha Bakery
        freelancerName:
          type: string
          description: Freelancer's display name.
          example: Riya
        currency:
          type: string
          description: ISO 4217 currency code.
          example: USD
        status:
          type: string
          description: Current status.
          example: held
        createdBy:
          type: string
          description: 'Who created the escrow: `person` or `agent`.'
          example: person
        createdAt:
          type: string
          description: Creation time, ISO 8601.
          example: '2026-11-12T10:15:00.000Z'
        totals:
          $ref: '#/components/schemas/Totals'
        milestoneCount:
          type: integer
          description: Number of milestones.
          example: 3
        needsReview:
          type: integer
          description: Number of milestones waiting for a person.
          example: 2
    LedgerEvent:
      type: object
      properties:
        id:
          type: integer
          description: Numeric ID.
          example: 1
        ts:
          type: string
          format: date-time
          description: Event time, ISO 8601.
          example: '2026-11-12T10:20:00.000Z'
        escrowId:
          type: string
          description: Escrow ID.
          example: esc_1a2b3c4d5e6f7a8b
        milestoneId:
          type: string
          nullable: true
          description: Milestone ID.
          example: ms_a42ffc3d34414c75
        type:
          type: string
          example: CAPTURED
          description: Type of event or item.
        actor:
          type: string
          description: 'Who performed the action: client, freelancer, reviewer, agent or system.'
          example: client
        amount:
          type: number
          nullable: true
          description: Amount in the escrow currency, as a decimal number.
          example: 400
        message:
          type: string
          description: Human-readable message.
          example: Milestone is due after the 29-day PayPal hold limit. Fund it closer to the start date.
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Event-specific details.
